<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<script>try{var t=localStorage.getItem("parkq_theme")||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");document.documentElement.dataset.theme=t;}catch(e){document.documentElement.dataset.theme="dark";}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ParkQ Gate</title>
<link rel="preload" href="/static/fonts/bai-jamjuree-latin-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/css/app.css">
<style>
  body { background: var(--panel-2); overflow: hidden; }
  .kiosk { height: 100vh; display: grid; grid-template-columns: 1.05fr 1fr; gap: 14px; padding: 14px; }
  .panel { background: var(--panel); border: 1px solid var(--steel-line); border-radius: 20px; padding: 24px 28px; display: flex; flex-direction: column; box-shadow: var(--shadow); }
  .brand { font: 700 15px var(--font-board); letter-spacing: .14em; color: var(--amber); text-transform: uppercase; }
  .lot { font: 700 28px/1.25 var(--font-board); margin-top: 6px; }
  .tags { display: flex; gap: 10px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  .dir { display: inline-block; background: var(--letter); color: var(--flap); border-radius: 999px; padding: 4px 14px; font: 700 18px var(--font-board); }
  .rules { margin: 26px 0 0; display: grid; gap: 0; max-width: 520px; }
  .rules > div { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-top: 1px solid var(--steel-line); font-size: 22px; }
  .rules dt { color: var(--steel-light); } .rules dd { margin: 0; font: 700 22px var(--font-board); }
  .free { margin-top: auto; }
  .free .cap { font: 600 22px var(--font-board); color: var(--steel-light); }
  .free .big { display: flex; align-items: flex-end; gap: 18px; flex-wrap: wrap; margin-top: 10px; }
  .free .of { font: 600 26px var(--font-board); color: var(--steel-light); padding-bottom: 12px; }
  .scan { align-items: center; justify-content: center; text-align: center; gap: 12px; }
  .scan-frame { width: 170px; height: 170px; flex: none; position: relative; display: grid; place-items: center; color: var(--amber); }
  .scan-frame::before { content: ""; position: absolute; inset: 0; border: 4px solid var(--amber); border-radius: 12px;
    clip-path: polygon(0 0,32% 0,32% 5%,5% 5%,5% 32%,0 32%,0 68%,5% 68%,5% 95%,32% 95%,32% 100%,68% 100%,68% 95%,95% 95%,95% 68%,100% 68%,100% 32%,95% 32%,95% 5%,68% 5%,68% 0,100% 0,100% 100%,0 100%); }
  .scan-frame .line { position: absolute; left: 14%; right: 14%; height: 3px; background: var(--amber); border-radius: 3px; animation: scan 2.2s ease-in-out infinite; }
  @keyframes scan { 0%,100% { top: 18%; } 50% { top: 80%; } }
  @media (prefers-reduced-motion: reduce) { .scan-frame .line { animation: none; top: 50%; } }
  .hint { font: 700 30px/1.3 var(--font-board); }
  #scanInput { position: fixed; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .result { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 40px; z-index: 30; }
  .result.ok { background: #f2f2f2; color: #0b0b0b; } .result.bad { background: var(--red-deep); color: #fff; }
  .result.pay { background: var(--flap); color: var(--letter); }
  .result h1 { font-size: 60px; } .result p { font-size: 28px; margin: 10px 0 0; }
  .plate-big { display: inline-block; font: 700 54px var(--font-board); border-radius: 8px; }
  .result.ok .plate-big { display: inline-block; background: #0b0b0b; color: #f2f2f2; font: 700 54px var(--font-board); padding: 4px 26px; border-radius: 8px; margin-top: 14px; }
  .pay-grid { display: grid; grid-template-columns: auto 1fr; gap: 32px; align-items: center; text-align: left; }
  .pay-grid img { width: 250px; height: 250px; }
  .foot { display: flex; gap: 10px; margin-top: 14px; }
  .manual { width: 100%; max-width: 420px; display: flex; gap: 8px; }
  .manual input { flex: 1; }
  .cam { width: min(100%, 440px); aspect-ratio: 4 / 3; object-fit: cover; border-radius: 16px; background: #000; border: 3px solid var(--amber); }
  .row-btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .row-btns .btn { min-height: 56px; font-size: 18px; }
  .cam-msg { color: var(--red); max-width: 440px; font-size: 16px; }
  @media (max-width: 860px) { .kiosk { grid-template-columns: 1fr; grid-template-rows: auto 1fr; overflow: auto; } body { overflow: auto; } .free .big .flap { --fs: 96px !important; } }
</style>
</head>
<body>
<div class="kiosk">
  <section class="panel">
    <div class="lot" id="lot" data-el="1">…</div>
    <div class="tags"><span class="dir" id="dir"></span> <span id="net" class="badge ok" data-el="4">ออนไลน์</span></div>
    <dl class="rules">
      <div><dt>อัตราค่าจอด</dt><dd id="rate">–</dd></div>
      <div><dt>เวลาเปิด–ปิด</dt><dd id="hours">–</dd></div>
      <div><dt>จอดฟรี</dt><dd>15 นาทีแรก</dd></div>
    </dl>
    <div class="free" data-el="3"><span class="cap">ช่องว่างคงเหลือ</span>
      <div class="big"><span id="free"></span><span class="of">/ <span id="cap"></span> ช่อง</span></div></div>
  </section>
  <section class="panel scan">
    <div class="scan-frame" data-el="5"><div class="line"></div>
      <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM18 18h3v3h-3zM14 20h2M20 14v2"/></svg></div>
    <video id="cam" class="cam hidden" muted playsinline></video>
    <div class="hint" id="hint" data-el="2">กรุณาสแกน QR ตั๋วที่เครื่องอ่าน</div>
    <div class="muted">ยังไม่มีตั๋ว? ซื้อสิทธิ์จอดได้ที่ <b>parkq.app</b></div>
    <form class="manual" id="manual"><input class="input" id="manualToken" placeholder="ทดสอบ: วางโค้ดตั๋ว แล้วกด Enter"><button class="btn sm">สแกน</button></form>
    <div class="row-btns"><button class="btn" id="camBtn" data-el="7">เปิดกล้องสแกน</button>
      <button class="btn ghost" id="call" data-el="6">เรียกพนักงาน</button></div>
    <div class="small cam-msg hidden" id="camMsg"></div>
  </section>
</div>
<input id="scanInput" autocomplete="off">
<div id="result" class="result hidden" role="alert" aria-live="assertive"></div>
<script type="module">
import { api, qs, esc, baht, hhmm, qrSrc, toast, startAnnotations } from "/static/js/common.js";
import { createScanner, cameraSupported } from "/static/js/scanner.js";
import { flapHtml, setFlap } from "/static/js/flap.js";
const lot = qs.get("lot") || "LOT01", dir = qs.get("dir") === "out" ? "out" : "in";
document.getElementById("dir").textContent = dir === "in" ? "ประตูทางเข้า" : "ประตูทางออก";
const $ = (id) => document.getElementById(id);
let config = {};
let busy = false;
const big = () => (innerWidth <= 860 ? 96 : Math.max(120, Math.min(210, Math.round(innerHeight / 4.6))));
$("free").innerHTML = flapHtml("–", { cells: 3, size: big(), label: "ช่องว่าง" });

async function info() {
  try {
    const i = await api(`/api/gate/${lot}/info`);
    $("lot").textContent = i.name; $("cap").textContent = i.capacity;
    $("rate").textContent = `${i.rate} บาท / ชม.`; $("hours").textContent = `${i.open_time}–${i.close_time} น.`;
    const tone = i.stale ? "dim" : i.free === 0 ? "bad" : i.free <= Math.max(2, i.capacity * 0.1) ? "warn" : "";
    setFlap($("free").querySelector(".flap"), i.stale ? "–" : String(i.free), { tone, label: i.stale ? "ไม่มีข้อมูลช่องว่าง" : `ช่องว่าง ${i.free} ช่อง` });
    $("net").className = "badge " + (i.stale ? "gray" : "ok"); $("net").textContent = i.stale ? "ออฟไลน์ – ใช้ข้อมูลตั๋วที่ซิงก์ไว้" : "ออนไลน์";
  } catch { $("net").className = "badge gray"; $("net").textContent = "ออฟไลน์"; }
}

function show(kind, html, ms = 5000) {
  if (qs.get("hold") === "1") ms = 0;   // keep the result on screen (demos / documentation screenshots)
  const r = $("result"); r.className = "result " + kind; r.innerHTML = `<div>${html}</div>`;
  if (ms) setTimeout(() => { r.className = "result hidden"; busy = false; info(); focusScanner(); }, ms);
}

async function scan(token) {
  if (busy || !token.trim()) return;
  busy = true;
  try {
    const r = await api(`/api/gate/${lot}/${dir}/scan`, { method: "POST", body: { token: token.trim() } });
    if (r.open) show("ok", `<h1 data-el="1">${dir === "in" ? "ยินดีต้อนรับ" : "ขอบคุณที่ใช้บริการ"}</h1><div class="plate-big" data-el="2">${esc(r.plate || "")}</div><p data-el="3">ไม้กั้นกำลังเปิด…</p>${dir === "in" && r.end_at ? `<p>จอดได้ถึง</p><div style="margin-top:6px">${flapHtml(hhmm(r.end_at), { size: 76 })}</div>` : ""}`);
    else if (r.result === "PAY_OVERSTAY") payOverstay(r);
    else show("bad", `<h1 data-el="1">ไม่สามารถผ่านได้</h1><p data-el="2">${esc(r.message)}</p><button class="btn" style="margin-top:30px;background:#fff;color:#7a0016;min-height:68px;font-size:22px;padding:0 44px" onclick="document.getElementById('call').click()" data-el="3">เรียกพนักงาน</button>`, 7000);
  } catch (e) { show("bad", `<h1>ระบบขัดข้อง</h1><p>${esc(e.message)}</p>`); }
}

function payOverstay(r) {
  const p = r.payment;
  show("pay", `<div class="pay-grid"><div class="qr-box" data-el="3"><img src="${qrSrc(p.qr_payload)}" alt="QR พร้อมเพย์"></div>
    <div><h1 style="font-size:42px;margin:0 0 8px;color:var(--amber)">จอดเกินเวลา</h1><div class="plate-big" style="background:var(--letter);color:#0b0b0b;font-size:34px;padding:2px 18px;margin:0 0 8px">${esc(r.plate)}</div>
      <p class="muted" data-el="1" style="font-size:24px">เกิน ${Math.floor(r.over_minutes / 60)} ชม. ${r.over_minutes % 60} นาที</p>
      <p data-el="2" style="font-size:24px">ค่าส่วนเกิน <b style="font-size:54px;color:var(--amber);font-family:var(--font-board)">${baht(p.amount)}</b></p>
      <p class="muted">สแกนจ่ายด้วยแอปธนาคาร ไม้กั้นจะเปิดอัตโนมัติ</p>
      ${p.demo ? `<div class="demo-note" style="margin-top:8px">QR ทดสอบ – ไม่ใช่การชำระเงินจริง</div>` : ""}
      <div class="foot"><button class="btn ghost" id="call2" data-el="4">เรียกพนักงาน</button>${config.dev ? `<button class="btn" id="sim">ทดสอบ: จำลองชำระสำเร็จ</button>` : ""}</div></div></div>`, 0);
  $("call2").onclick = () => $("call").click();
  if ($("sim")) $("sim").onclick = () => api(`/api/payments/${p.id}/simulate`, { method: "POST" }).catch(() => {});
  const poll = setInterval(async () => {
    const x = await api(`/api/payments/${p.id}`).catch(() => null);
    if (x?.status === "PAID") { clearInterval(poll); show("ok", `<h1>ชำระเงินแล้ว</h1><div class="plate-big">${esc(r.plate)}</div><p>ไม้กั้นกำลังเปิด… ขอบคุณที่ใช้บริการ</p>`); }
    if (x?.status === "EXPIRED") { clearInterval(poll); show("bad", `<h1>หมดเวลาชำระ</h1><p>กรุณาสแกนใหม่หรือเรียกพนักงาน</p>`); }
  }, 2000);
}

// Camera scanning (laptop / phone mounted at the gate). The USB reader path below keeps working at the same time.
const cam = createScanner({
  video: $("cam"), onCode: (code) => scan(code),
  onError: (e) => { $("camMsg").textContent = e.message; $("camMsg").classList.remove("hidden"); setCamUi(false); },
});
function setCamUi(on) {
  $("cam").classList.toggle("hidden", !on);
  document.querySelector(".scan-frame").classList.toggle("hidden", on);
  $("camBtn").textContent = on ? "ปิดกล้อง" : "เปิดกล้องสแกน";
  $("hint").textContent = on ? "ถือ QR ตั๋วให้อยู่หน้ากล้อง" : "กรุณาสแกน QR ตั๋วที่เครื่องอ่าน";
}
$("camBtn").addEventListener("click", async () => {
  $("camMsg").classList.add("hidden");
  if (cam.running) { cam.stop(); setCamUi(false); return; }
  setCamUi(true);
  await cam.start();                       // on failure onError switches the UI back and shows the reason
  if (!cam.running) setCamUi(false);
});
if (!cameraSupported()) $("camBtn").classList.add("hidden");
// USB/serial QR readers type the code followed by Enter into the focused field.
const focusScanner = () => { if (document.activeElement !== $("manualToken")) $("scanInput").focus(); };
$("scanInput").addEventListener("keydown", (e) => { if (e.key === "Enter") { scan($("scanInput").value); $("scanInput").value = ""; } });
$("manual").addEventListener("submit", (e) => { e.preventDefault(); scan($("manualToken").value); $("manualToken").value = ""; });
$("call").addEventListener("click", async () => { await api(`/api/gate/${lot}/${dir}/call`, { method: "POST" }).catch(() => {}); toast("แจ้งพนักงานแล้ว กรุณารอสักครู่"); });
document.addEventListener("click", (e) => { if (!e.target.closest("input,button")) focusScanner(); });

(async () => {
  try { config = await api("/api/config"); } catch {}
  if (!config.dev) $("manual").classList.add("hidden");
  await info(); setInterval(info, 5000); focusScanner(); startAnnotations();
  if (qs.get("token")) scan(qs.get("token"));
  if (qs.get("demo") === "fail") show("bad", `<h1 data-el="1">ไม่สามารถผ่านได้</h1><p data-el="2">QR นี้ถูกใช้แล้ว</p><button class="btn" style="margin-top:30px;background:#fff;color:#7a0016;min-height:68px;font-size:22px;padding:0 44px" data-el="3">เรียกพนักงาน</button>`, 0);
})();
</script>
</body>
</html>
