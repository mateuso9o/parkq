[env:esp32dev]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    madhephaestus/ESP32Servo@3.2.1
    bblanchon/ArduinoJson@7.4.3

; Demo with nothing wired: BOOT button = slot sensor 1, GPIO2 LED = barrier light. Upload with: pio run -e minimal -t upload
[env:minimal]
extends = env:esp32dev
build_flags = -DMINIMAL_DEMO
